services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      GATEWAY_DIAGNOSTICS_DIR: /var/lib/deepseek-qwen-gateway/diagnostics
    ports:
      - "${GATEWAY_PUBLISH_HOST:-127.0.0.1}:${GATEWAY_PUBLISH_PORT:-8000}:8000"
    volumes:
      - gateway-data:/var/lib/deepseek-qwen-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  gateway-data:
